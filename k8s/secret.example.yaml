# ⚠️ 이 파일은 "예시" 입니다. 실제 비밀값을 여기에 적어 Git 에 커밋하지 마세요.
# ArgoCD Application 에서 *.example.yaml 은 제외하도록 설정되어 있습니다.
#
# 실제 Secret 생성 방법 (택 1):
#
# 1) kubectl 로 직접 생성 (가장 간단, 클러스터에만 존재하고 Git 에는 안 올라감)
#    ⚠️ <namespace> 는 실제 대상 환경의 namespace(dev: dpyb-auth-dev,
#       prod: dpyb-auth)로 반드시 바꿔서 실행하세요. 특정 namespace를
#       그대로 복사해 실행하면 잘못된 환경에 Secret이 생성될 수
#       있습니다.
#    kubectl create secret generic backend-auth-secret \
#      --namespace <namespace> \
#      --from-literal=DATABASE_URL='postgresql+psycopg://user:pass@host:5432/db' \
#      --from-literal=COGNITO_BACKEND_CLIENT_SECRET='xxxxxxxx'
#
# 2) SealedSecrets / External Secrets Operator 를 써서 암호화된 형태로 Git 관리 (권장, 운영환경)
#    - SealedSecrets: kubeseal 로 암호화한 SealedSecret 을 커밋
#    - External Secrets: AWS Secrets Manager / SSM Parameter Store 와 연동
#
# 아래는 참고용 구조입니다.
apiVersion: v1
kind: Secret
metadata:
  name: backend-auth-secret
  # ⚠️ 실제 대상 환경의 namespace(dev: dpyb-auth-dev, prod: dpyb-auth)로
  # 반드시 바꿔서 적용하세요. 아래 값을 그대로 복사해 적용하면 잘못된
  # 환경에 Secret이 생성될 수 있습니다.
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: backend-auth
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://<user>:<password>@<host>:5432/<database>"
  # 신규 backend 전용 App Client(secret 있음, CLIAR-148/153)의 Client
  # Secret. app/core/config.py의 COGNITO_BACKEND_CLIENT_SECRET이 실제로
  # 읽는 이름과 정확히 일치해야 한다(과거 이름 COGNITO_CLIENT_SECRET
  # 아님, CLIAR-162 Phase 7B에서 정정).
  COGNITO_BACKEND_CLIENT_SECRET: "<optional>"
