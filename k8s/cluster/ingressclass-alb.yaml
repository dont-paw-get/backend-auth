# EKS Auto Mode ALB 용 IngressClass 설정 (클러스터 전역, 한 번만 적용)
#   kubectl apply -f k8s/cluster/ingressclass-alb.yaml
#
# dev/prod 두 환경의 Ingress 가 이 IngressClass(alb) 를 공유합니다.
# (Ingress 마다 별도의 ALB 가 생성됨)
---
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  # 외부 노출 ALB. 내부 전용으로 하려면 internal 로 변경.
  scheme: internet-facing
  # HTTPS 를 쓰려면 ACM 인증서 ARN 추가:
  # certificateARNs:
  #   - arn:aws:acm:ap-northeast-2:<ACCOUNT_ID>:certificate/xxxxxxxx
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    # ingressClassName 을 생략한 Ingress 는 이 클래스를 기본으로 사용
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  # EKS Auto Mode 내장 컨트롤러 (self-managed LB Controller 아님)
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
