# 개발 환경에서 base ConfigMap 위에 덮어쓸 값
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-auth-config
data:
  APP_ENV: "development"
  COGNITO_USER_POOL_ID: "ap-northeast-2_y1mKz50El"
  # CLIAR-162 Phase 7 최종 전환: 기존 FE App Client(COGNITO_CLIENT_ID)
  # 설정은 여기서 제거되었다 — 프론트 인증이 Cognito/backend-auth와
  # 전혀 연동된 적이 없음이 확인되어, app/core/config.py에서도 이
  # 설정 자체를 더 이상 읽지 않는다(과도기 dual-accept였던 Phase 7A
  # 종료). base ConfigMap에는 이 키의 placeholder 값이 여전히 남아
  # 있을 수 있으나(k8s/base/configmap.yaml, 이번 Phase에서는 건드리지
  # 않음), 애플리케이션은 이를 읽지 않으므로 무해하다.
  # 신규 backend 전용 App Client(secret 있음, CLIAR-148/153). Client
  # ID 자체는 비밀값이 아니므로 Secret이 아닌 ConfigMap에 둔다. 실제
  # secret(COGNITO_BACKEND_CLIENT_SECRET)은 backend-auth-secret에
  # 별도로 주입해야 한다(k8s/secret.example.yaml 참고, Phase 7C 전
  # 필수 — 이 secret이 없으면 login/signup 등이 RuntimeError로 실패).
  COGNITO_BACKEND_CLIENT_ID: "du6sabh7hm17goodv6sd2n9ag"
  # CloudFront(https://d1wab52ln5by5k.cloudfront.net/api/*)가
  # backend-auth DEV ALB로 same-origin 라우팅되도록 구성되어, 브라우저는
  # 항상 HTTPS로 auth API를 호출한다. 이제 Secure 쿠키가 정상 저장되므로
  # base 기본값(True)과 동일하게 명시적으로 true로 둔다(과거 ALB
  # HTTP:80 직접 노출 시절의 임시 비활성화는 종료).
  COOKIE_SECURE: "true"

  # ---- 관측 (app/core/tracing.py) ----
  #
  # deployment.environment.name 은 Tempo/Loki 에서 dev·prod 텔레메트리를
  # 구분하는 표준 리소스 속성이다. service.name 은 base 의
  # OTEL_SERVICE_NAME("backend-auth")에서 온다.
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=dev"
  #
  # OpenTelemetry Collector (dpgy-infra 소유, docs/production_architecture.md §9).
  # dev 클러스터에서 이 Service DNS 로 OTLP HTTP 수신이 동작하는 것을 확인했다.
  # 이 값이 주입되는 순간 app/core/tracing.py 가 TracerProvider + OTLP
  # http/protobuf exporter 를 켠다(값이 없으면 tracing 전체가 꺼진 채 동작).
  #
  # 포트 4318 = OTLP http/protobuf 수신 포트. exporter 는 이 base endpoint 뒤에
  # /v1/traces 를 자동으로 붙인다(경로를 여기 쓰지 않는다). 4317(gRPC)를
  # 가리키면 export 가 실패한다.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  #
  # 인프라 Collector 는 traces 파이프라인만 받는다(gRPC 4317 은 닫혀
  # 있음). 아래 세 값은 그 전제를 환경변수로도 못박는다.
  #  - PROTOCOL=http/protobuf : app/core/tracing.py 는 이미 http exporter 를
  #    명시적으로 쓰지만, opentelemetry-instrument 등 자동 구성 경로가
  #    끼더라도 gRPC 로 넘어가지 않도록 표준 변수로 고정한다.
  #  - METRICS_EXPORTER=none : 메트릭은 OTLP 가 아니라 /metrics(Prometheus)
  #    로 노출한다(app/core/metrics.py). Collector 로 보내지 않는다.
  #  - LOGS_EXPORTER=none : 로그는 stdout JSON -> Alloy -> Loki 경로다.
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  #
  # dev 는 트레이스 검증이 목적이므로 전량 샘플링한다. ratio 방식으로 두어
  # prod 확장 시 SAMPLER_ARG 만 낮추면 되도록 한다(코드 변경 없음). ARG=1.0
  # 은 100%. 상위 traceparent 의 sampled 결정은 parentbased 가 존중한다.
  # app/core/tracing.py 는 sampler 를 코드에 넣지 않고 이 두 표준 환경변수를
  # SDK 가 읽게 한다.
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
