# dev 환경 backend-auth SA 에 IRSA 롤 ARN 을 주입합니다.
# (PLAN.md §B / docs/auth-architecture.md §8.2, CLIAR-183)
#
# 이 롤은 보상·복구 경로(admin_get_user / admin_delete_user)만을 위한 것이며
# cognito-idp:AdminGetUser / AdminDeleteUser 2개 액션만 가집니다.
# 정책은 해당 환경의 User Pool ARN 하나로 스코핑돼 있습니다.
#   role   : dpyb-auth-irsa-dev
#   policy : dpyb-auth-cognito-admin-dev
#   trust  : system:serviceaccount:dpyb-auth-dev:backend-auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-auth
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::594532711953:role/dpyb-auth-irsa-dev
