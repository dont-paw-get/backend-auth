apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 개발 환경 (develop 브랜치 → dpyb-auth-dev 네임스페이스)
namespace: dpyb-auth-dev

resources:
  - ../../base
  # dev 전용: Prometheus 스크레이핑 대상 등록 (관측 인프라 연동, dev 한정)
  - servicemonitor.yaml

# 개발은 1개만
replicas:
  - name: backend-auth
    count: 1

# 개발용 이미지. CI 가 newTag 를 커밋 SHA 로 갱신합니다.
images:
  - name: backend-auth
    newName: 594532711953.dkr.ecr.ap-northeast-2.amazonaws.com/dpyb-dev/dpyb-auth
    newTag: 37b365734e50d40b69c2fb4921b1f664aecad204

# 개발 환경에서 달라지는 설정값만 덮어씀
patches:
  - path: configmap-patch.yaml
  # IRSA 롤 ARN 주입 (CLIAR-183 에서 롤 생성 완료)
  - path: serviceaccount-patch.yaml
