# 상용 환경에서 base ConfigMap 위에 덮어쓸 값
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-auth-config
data:
  APP_ENV: "production"
  # CLIAR-183: prod User Pool / backend App Client 실제 생성 완료.
  # (docs/auth-architecture.md §8.1 사양대로 dev와 동일 설정으로 생성)
  COGNITO_USER_POOL_ID: "ap-northeast-2_v5UmqpECS"
  # 신규 backend 전용 App Client(secret 있음). Client ID 자체는 비밀값이
  # 아니므로 Secret이 아닌 ConfigMap에 둔다. 실제 secret
  # (COGNITO_BACKEND_CLIENT_SECRET)은 backend-auth-secret에 별도로 주입해야
  # 한다 — 없으면 /auth/login 과 쿠키 /auth/refresh 가 secret_hash() 의
  # RuntimeError 로 500 이 된다.
  COGNITO_BACKEND_CLIENT_ID: "3l3m4q175dh6l8u1iuksfp66d2"
  # 기존 FE App Client 설정(COGNITO_CLIENT_ID)은 여기서 제거했다 —
  # CLIAR-162 Phase 7 이후 app/core/config.py 가 이 키를 읽지 않는다
  # (dev overlay 와 동일한 처리). base ConfigMap 의 placeholder 값이
  # 그대로 흘러오지만 애플리케이션이 읽지 않으므로 무해하다.
  #
  # TODO(CLIAR-183): CORS_ALLOWED_ORIGINS 는 아직 주입하지 않았다. prod FE
  # 오리진이 존재하지 않기 때문이다(CloudFront 배포가 dev 하나뿐이고 prod
  # ALB 는 도메인 없이 HTTP:80 으로만 노출돼 있다). prod FE 가 배포되면
  # 그 오리진을 여기에 명시해야 한다 — 비어 있으면 cross-origin 요청이
  # 전혀 허용되지 않는다. 와일드카드는 allow_credentials=true 와 함께
  # 쓸 수 없다.

  # ---- 관측 (app/core/tracing.py) ----
  #
  # deployment.environment.name 은 Tempo/Loki 에서 dev·prod 텔레메트리를
  # 구분하는 표준 리소스 속성이다. service.name 은 base 의
  # OTEL_SERVICE_NAME("backend-auth")에서 온다.
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=prod"
  #
  # TODO: OpenTelemetry Collector 주소를 주입해야 tracing 이 켜진다.
  # collector 는 이 저장소가 아니라 dpgy-infra 가 소유하므로
  # (docs/production_architecture.md §9), 실제 Service DNS 를 확인한 뒤
  # 아래 주석을 풀어 채운다. 값이 비어 있는 동안 애플리케이션은 tracing
  # 없이 정상 동작한다(구조화 로그는 그와 무관하게 이미 나간다).
  # 포트는 OTLP http/protobuf 수신 포트(기본 4318)여야 한다.
  #
  # prod 는 replicas 2 이므로 두 파드가 같은 service.name 으로 텔레메트리를
  # 보낸다. 파드 구분은 SDK 가 자동으로 넣는 service.instance.id 로 된다.
  #
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://<collector-service>.<namespace>.svc.cluster.local:4318"
