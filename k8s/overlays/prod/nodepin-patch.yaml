# 상용 전용: backend-auth 파드를 auth 전용 노드그룹에만 배치합니다.
#
# 전제) 인프라(eksctl/terraform)에서 아래 노드그룹이 먼저 준비되어 있어야 합니다.
#   - label : workload=auth      (nodeSelector 가 이 노드를 고름)
#   - taint : dedicated=auth:NoSchedule
#             (toleration 없는 다른 서비스 파드가 이 노드로 못 들어오게 막음)
#
# label 만으로는 "backend-auth 는 auth 노드로 간다"만 보장되고,
# 다른 서비스가 auth 노드로 끼어드는 것은 taint 로 막습니다. → label + taint 조합.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-auth
spec:
  template:
    spec:
      nodeSelector:
        workload: auth
      tolerations:
        - key: dedicated
          operator: Equal
          value: auth
          effect: NoSchedule
