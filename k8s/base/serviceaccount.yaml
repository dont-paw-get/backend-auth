# backend-auth 전용 ServiceAccount (CLIAR-183 / PLAN.md §B, docs/auth-architecture.md §8.2)
#
# 목적) 보상·복구 경로(admin_get_user / admin_delete_user)가 IRSA 로
# cognito-idp:AdminGetUser / AdminDeleteUser 권한을 얻게 하기 위함입니다.
# 지금까지는 serviceAccountName 이 없어 네임스페이스의 default SA 를 썼고,
# 그 경우 파드는 노드 인스턴스 롤 자격증명을 그대로 사용했습니다.
#
# 여기(base)에는 eks.amazonaws.com/role-arn 어노테이션을 두지 않습니다.
# 롤 ARN 은 환경(dev/prod)마다 다르므로 overlay 의 serviceaccount-patch.yaml
# 에서 주입합니다.
#
# 주의) 어노테이션이 없는 상태의 이 SA 는 default SA 와 자격증명 동작이
# 동일합니다(노드 롤 사용). 즉 이 파일만 적용하는 것은 무해하며, 실제
# 권한 변화는 overlay 패치를 활성화한 시점부터 발생합니다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-auth
  labels:
    app.kubernetes.io/name: backend-auth
