apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-auth-config
  labels:
    app.kubernetes.io/name: backend-auth
# 민감하지 않은 설정값만 여기에 둡니다.
# DB 접속정보, Cognito Client Secret 등 비밀값은 Secret 에 둡니다.
data:
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  AWS_REGION: "ap-northeast-2"
  # 실제 사용하는 Cognito User Pool / Client ID 로 채워주세요.
  COGNITO_USER_POOL_ID: "ap-northeast-2_XXXXXXXXX"
  COGNITO_CLIENT_ID: "xxxxxxxxxxxxxxxxxxxxxxxxxx"

  # CLIAR-230: refresh 쿠키(refresh_token/refresh_sub)의 Max-Age(초).
  # 없으면 세션 쿠키가 되어 브라우저/탭 종료 시 세션이 유실된다.
  # Cognito refresh token 유효기간(기본 30일) 이하로 정렬한다.
  # 2592000 = 30일. 0 이하로 두면 세션 쿠키로 동작한다.
  COOKIE_MAX_AGE: "2592000"

  # ---- 관측 (app/core/logging_config.py, app/core/tracing.py) ----
  #
  # 로그: 애플리케이션 stdout -> Grafana Alloy -> Loki.
  # 파드 stdout 을 Alloy 가 수집하므로 앱 쪽에 추가 설정은 없다.
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # 트레이스: 애플리케이션 -> OTLP -> OpenTelemetry Collector -> Tempo.
  #
  # OTEL_EXPORTER_OTLP_ENDPOINT 는 환경마다 collector 주소가 다르므로
  # base 에 두지 않고 overlay 에서만 주입한다. 이 값이 없으면
  # app/core/tracing.py 가 tracing 을 아예 켜지 않는다(연결 실패
  # 로그를 반복해서 남기지 않기 위한 의도된 동작).
  #
  # exporter 프로토콜은 OTLP http/protobuf 이므로 collector 의 otlp
  # receiver 에서 http endpoint(기본 4318)가 열려 있어야 한다.
  # gRPC(4317)를 가리키면 export 가 실패한다.
  OTEL_SERVICE_NAME: "backend-auth"
