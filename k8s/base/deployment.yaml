apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-auth
  labels:
    app.kubernetes.io/name: backend-auth
spec:
  # replicas 는 overlay 에서 환경별로 지정 (dev=1, prod=2 — prod 는 현재 주석 상태)
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-auth
    spec:
      # IRSA 대상 SA. 어노테이션(role-arn)은 overlay 에서 환경별로 주입합니다.
      # (k8s/base/serviceaccount.yaml / docs/auth-architecture.md §8.2)
      serviceAccountName: backend-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # DB 스키마 마이그레이션을 앱 기동 전에 1회 수행
      initContainers:
        - name: migrate
          # 이미지 실제 경로/태그는 overlay 의 images: 트랜스포머가 주입 (CI 가 태그 갱신)
          image: backend-auth
          # develop-latest 처럼 고정 태그를 재사용하므로, 노드에 캐시된
          # 옛 이미지를 쓰지 않도록 항상 새로 pull 한다.
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: backend-auth-config
            - secretRef:
                name: backend-auth-secret
      containers:
        - name: backend-auth
          image: backend-auth
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-auth-config
            - secretRef:
                name: backend-auth-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
